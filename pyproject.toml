[project]
name = "semantic"
version = "0.2.0"
description = "Generates and exports semantic embeddings for the Hebrew Psalms as BHSA-node-keyed Parquet datasets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "text-fabric>=13.1.0",
    "numpy>=1.26",
    "pyarrow>=17.0",
    "sentence-transformers>=3.0",
    "openai>=1.0",
    "cohere>=5.0",
    "einops>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
tehillim-embeddings-generate = "semantic.generate:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a local BHSA Text-Fabric dataset (see TEHILLIM_BHSA_PATH)",
    "api_integration: makes one real call to a paid embedding API, requires the provider's API key (skipped automatically when unset)",
]
