[project]
name = "embeddings"
version = "0.8.0"
description = "Generates and exports feature representations for the Hebrew Psalms as BHSA-node-keyed Parquet datasets."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "text-fabric>=13.1.0",
    "numpy>=1.26",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
# The lexical, morphological, and syntactic domains need none of this stack.
semantic = [
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "torch>=2.2",
    "openai>=1.0",
    "cohere>=5.0",
    # Imported by the trust_remote_code checkpoints' own modelling code, never by this repo.
    "einops>=0.7",
]
dev = [
    "embeddings[semantic]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "deptry>=0.16",
    "vulture>=2.11",
]

[project.scripts]
tehillim-embeddings-generate = "semantic.generate:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Everything ruff implements, minus the families below, each excluded for a stated reason.
select = ["ALL"]
ignore = [
    # The one-line docstring convention this repo uses conflicts with pydocstyle's
    # multi-line summary, blank-line, and imperative-mood rules.
    "D203", "D205", "D212", "D400", "D401", "D415",
    # Positional booleans are readable in the vectorizer signatures that use them.
    "FBT001", "FBT002",
    # Copyright headers are not used in this repo.
    "CPY001",
    # assert is how pytest expresses expectations.
    "S101",
    # Comment formatting: the `#:` prefix marks provenance notes throughout.
    "E265",
    # Conflicts with the formatter, which owns trailing commas.
    "COM812",
    # Heavy optional imports (torch, transformers) are deliberately deferred into functions.
    "PLC0415",
    # Detailed, self-contained error messages are preferred over terse ones.
    "TRY003", "EM101", "EM102",
    # Moving runtime-needed names into TYPE_CHECKING breaks dataclass field resolution.
    "TC001", "TC002", "TC003",
    # The 2 and 3 flagged are n-gram orders, inside functions named for those orders.
    "PLR2004",
    # RARE_TOKEN and NONE_SUFFIX_TOKEN are vocabulary sentinels, not credentials.
    "S105",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
# Test names and bodies are the documentation; annotating every fixture adds noise, not signal.
"tests/**" = ["ANN", "D10", "PLR2004", "S", "SLF001", "ARG", "INP001", "PLR0913", "PLR0917"]
# A generator's stdout/stderr progress line is its interface.
"src/*/generate*.py" = ["T201"]
"src/*/scripts/*.py" = ["T201", "ANN401"]
"src/syntactic/skeleton.py" = ["T201"]
"src/semantic/local_models.py" = ["T201", "ANN401", "PLR0913"]
# Text-Fabric names features at runtime and torch ships no types, so Any is accurate here.
"src/core/corpus.py" = ["ANN401"]
"src/syntactic/corpus.py" = ["ANN401"]
"src/core/cli.py" = ["ANN401", "T201"]
"src/lexical/frequency.py" = ["ANN401"]
"src/lexical/surface_frequency.py" = ["ANN401"]
"src/semantic/api_models.py" = ["ANN401"]
"src/semantic/large_models.py" = ["ANN401"]
# The Hive path carries five optional partition tiers plus the payload and description.
"src/core/export.py" = ["PLR0913", "T201"]
# The Colab notebook clones BHSA from a literal URL; `git` is resolved from Colab's PATH.
"scripts/*.ipynb" = ["S603", "S607", "T201"]
# A vulture whitelist is by format a list of bare attribute expressions.
".vulture-whitelist.py" = ["B018"]

[tool.mypy]
# Matches requires-python's floor and the CI interpreter.
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.deptry]
known_first_party = ["core", "lexical", "morphological", "semantic", "syntactic"]

[tool.deptry.per_rule_ignores]
# einops is a runtime need of remote checkpoint code; the rest are tools CI invokes.
DEP002 = ["einops", "pytest", "pytest-cov", "ruff", "mypy", "deptry", "vulture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=src", "--cov-report=term-missing", "--cov-fail-under=90"]
# A numpy warning means a statistic silently degenerated, so it fails the build.
filterwarnings = ["error"]
markers = [
    "integration: requires a local BHSA Text-Fabric dataset (see TEHILLIM_BHSA_PATH)",
    "api_integration: makes one real call to a paid embedding API, requires the provider's API key (skipped automatically when unset)",
]

[tool.coverage.run]
source = ["src"]
#: Dataset generation runs its constructions in worker processes, which coverage must follow.
concurrency = ["multiprocessing"]
parallel = true
sigterm = true

[tool.coverage.report]
#: main() is CLI wiring under test like any other code, so only unreachable lines are excluded.
exclude_also = [
    "^if __name__ == .__main__.:$",
]
